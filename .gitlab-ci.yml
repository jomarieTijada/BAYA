stages:
  - validate

validate_repository:
  stage: validate
  image: alpine:3.20

  script:
    - echo "Checking BAYA repository structure..."
    - test -f README.md
    - test -d apps
    - test -d services
    - test -d ml
    - test -d contracts
    - test -d docs
    - test -d infrastructure
    - test -d scripts
    - test -d research
    - test -d tests
    - echo "BAYA repository validation passed."