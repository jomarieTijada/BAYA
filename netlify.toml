# Netlify Configuration for BAYA (Baybayin Interactive Learning System)
# Repository Root: C:\BAYA
# App Directory: apps/mobile
# Production Output: apps/mobile/dist

[build]
  base = ""
  command = "npm run export:web --workspace=apps/mobile"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "22"
  # Public client configuration only. Database access is enforced by Supabase RLS.
  EXPO_PUBLIC_SUPABASE_URL = "https://xqtsrsxhfylfldtfbuhe.supabase.co"
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yUPPhI5BKZUGCghcZP6mmA_rQfwES3j"
  EXPO_PUBLIC_ENABLE_DB_INSPECTOR = "false"
  NPM_FLAGS = "--legacy-peer-deps"

# Client-side Single Page Application (SPA) routing for Expo Router.
# Non-file requests rewrite to index.html with HTTP 200. Existing static files are served directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    # Cross-Origin Isolation required for WebAssembly threads / SharedArrayBuffer
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service worker must never be cached by HTTP cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Web App Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Root HTML
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ONNX Model Artifacts (binary octet-stream, immutable)
[[headers]]
  for = "/models/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

# WebAssembly Files (application/wasm, immutable)
[[headers]]
  for = "/ort/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Hashed Expo Bundles and Static Assets (immutable)
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
